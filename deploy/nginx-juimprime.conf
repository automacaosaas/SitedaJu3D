# nginx na frente do site (Node em 127.0.0.1:3000). Instalado por deploy/setup-servidor.sh em
# /etc/nginx/sites-available/juimprime. Quando o domínio apontar para cá: trocar "server_name _" pelo domínio e rodar
# "sudo certbot --nginx -d juimprimepramim.com.br -d www.juimprimepramim.com.br" (ele acrescenta o HTTPS sozinho).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Nada no site recebe arquivos grandes.
    client_max_body_size 2m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # O site usa o primeiro endereço de X-Forwarded-For (limites por IP): o nginx escreve só o do visitante,
        # para ninguém conseguir inventar outro.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
