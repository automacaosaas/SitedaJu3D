<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Prévia do e-mail · Ju imprime pra mim</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:28px 16px;background:#f7ebec;color:#282326;font:14px/1.5 'DM Sans',Arial,sans-serif}
    .intro{max-width:600px;margin:0 auto 18px;text-align:center}.intro h1{margin:0;font:500 26px/1.2 Georgia,serif}.intro p{margin:7px 0 0;color:#7b7076}
    .controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}.controls label{display:grid;gap:4px;font-size:12px;color:#7b7076;text-align:left}
    .controls select{min-height:44px;padding:0 12px;border:1px solid #65364924;border-radius:12px;background:#fffcfb;color:#282326;font:inherit}
    .email-frame{display:block;width:100%;max-width:632px;height:1000px;margin:0 auto;border:0;border-radius:24px;background:#fff;box-shadow:0 18px 45px #65364924}
    .note{max-width:600px;margin:0 auto;padding:16px;border-radius:16px;background:#fffcfb;text-align:center;color:#7b7076}
    @media(max-width:620px){body{padding:18px 8px}.email-frame{height:1090px;border-radius:16px}}
  </style>
</head>
<body>
  <main class="intro">
    <h1>Prévia do e-mail</h1>
    <p>Exemplo visual gerado pelo mesmo código que envia o e-mail de verdade. O código mostrado não é válido.</p>
    <div class="controls">
      <label>Tipo<select id="purpose"><option value="signup">Cadastro</option><option value="access">Primeiro acesso</option><option value="reset">Recuperação de acesso</option></select></label>
      <label>Idioma<select id="lang"><option value="pt-BR">Português</option><option value="en">English</option><option value="es">Español</option></select></label>
    </div>
  </main>
  <iframe class="email-frame" title="Prévia do e-mail de verificação"></iframe>
  <p class="note" hidden>A prévia só existe fora de produção. Para vê-la no seu computador, rode <code>node tools/dev-server.cjs</code> e abra <code>http://localhost:8844/email-preview.html</code>.</p>
  <script>
    (function () {
      var frame = document.querySelector('iframe'), note = document.querySelector('.note');
      function load() {
        var url = '/api/email-preview?purpose=' + document.getElementById('purpose').value + '&lang=' + document.getElementById('lang').value;
        fetch(url).then(function (response) {
          var available = response.ok;
          frame.hidden = !available; note.hidden = available;
          if (available) frame.src = url;
        }).catch(function () { frame.hidden = true; note.hidden = false; });
      }
      document.getElementById('purpose').addEventListener('change', load);
      document.getElementById('lang').addEventListener('change', load);
      load();
    })();
  </script>
</body>
</html>
