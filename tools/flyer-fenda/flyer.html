<!doctype html>
<!-- Flyer das lâmpadas de fenda (render.cjs abre esta página no Chrome e salva os JPG). Servida da raiz do repositório, com a base em
     dist/: usa as fontes, as imagens, a peça encaixada (escolha.js › fitFigure, escolha.css), os nomes e os preços do próprio site.
     Parâmetros: format=flyer (1080x1350, conversa e feed do WhatsApp), status (1080x1920, Status e Stories), og (1200x630, a prévia
     do link de fenda.html); url = o endereço do QR e do texto. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base href="/dist/">
<link rel="stylesheet" href="escolha.css">
<style>
@font-face{font-family:'DM Sans';font-weight:400 700;src:url(assets/fonts/dm-sans-latin.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:500 700;src:url(assets/fonts/playfair-display-latin.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:500 700;src:url(assets/fonts/playfair-display-italic-latin.woff2) format('woff2')}
@font-face{font-family:Parisienne;src:url(assets/fonts/parisienne-latin.woff2) format('woff2')}
:root{--ink:#33200f;--muted:#634526;--accent:#86441a;--rose:#b64c68}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
/* o degradê das três: o creme do macaco no meio, o dourado da girafa e o lilás do unicórnio nas bordas */
.sheet{position:relative;overflow:hidden;width:var(--w);height:var(--h);background:radial-gradient(70% 55% at 50% 52%,#fffbf2 0%,#f8ecd2 52%,#efdcb8 100%)}
.sheet::before,.sheet::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.sheet::before{width:520px;height:520px;right:-200px;top:-180px;background:radial-gradient(circle,#f4c43155,transparent 70%)}
.sheet::after{width:560px;height:560px;left:-230px;bottom:-230px;background:radial-gradient(circle,#c9a3e655,transparent 70%)}
.top{position:absolute;display:flex;align-items:center;gap:22px}
.logo{width:var(--logo);height:var(--logo);border-radius:50%;overflow:hidden;background:#fcedef;box-shadow:0 8px 24px #33200f1f,0 0 0 5px #fff}
.logo img{display:block;width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;align-items:center;padding:.5em 1.1em .5em 1.3em;border-radius:999px;background:linear-gradient(135deg,#2a1508,#43230f);color:#ffe27a;font-size:var(--pill);font-weight:700;letter-spacing:.24em;text-transform:uppercase;outline:1px dashed rgba(255,255,255,.35);outline-offset:-4px;box-shadow:0 0 0 3px rgba(255,255,255,.75),0 8px 22px -6px #d9964fbb}
.title{position:absolute}
.kicker{margin:0;font-size:var(--kicker);font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
h1{margin:.12em 0 0;font:500 var(--h1)/1 'Playfair Display',Georgia,serif;letter-spacing:-.02em}
h1 em{display:block;margin-top:.14em;font-size:var(--em);color:var(--accent);font-style:italic}
.lede{margin:var(--gap) 0 0;font-size:var(--lede);line-height:1.45;color:var(--muted)}
.lede b{color:var(--ink);font-weight:650}
/* as três peças encaixadas na lâmpada, a do meio na frente */
.row{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.pick{display:grid;justify-items:center;gap:6px;width:var(--fig-w)}
.pick .fit-figure{margin-bottom:calc(var(--fig-h) * -.1)}
.pick .fit-figure{height:var(--fig-h)}
.pick:nth-child(2){z-index:1;width:var(--fig-w-main)}
.pick:nth-child(2) .fit-figure{height:var(--fig-h-main)}
.pick:not(:nth-child(2)){margin:0 calc(var(--fig-w) * -.2)}
.pick span{font:500 var(--name)/1 'Playfair Display',Georgia,serif;white-space:nowrap}
.pick small{font-size:calc(var(--name) * .62);font-weight:650;color:var(--muted)}
.fit-float,.fit-ground{animation:none!important}
.cta{position:absolute;display:flex;align-items:center;justify-content:space-between;gap:28px;padding:var(--cta-pad);border-radius:36px;background:#fffffff2;box-shadow:0 20px 50px -20px #33200f40}
.cta-text{display:grid;gap:12px}
.button{display:inline-flex;align-items:center;justify-self:start;gap:14px;min-height:var(--btn-h);padding:0 calc(var(--btn-h) * .48);border-radius:999px;background:var(--accent);color:#fff;font-size:var(--btn);font-weight:700;white-space:nowrap;box-shadow:0 14px 30px -12px #86441acc}
.button svg{width:1.1em;height:1.1em}
.offer{font-size:var(--offer);font-weight:650;color:var(--ink)}
.offer i{font-style:normal;color:#1f7a4d}
.where{display:grid;gap:4px}
.where small{font-size:var(--where-sub);color:var(--muted)}
.where strong{font-size:var(--where);font-weight:700;letter-spacing:-.01em}
.qr{flex:none;width:var(--qr);height:var(--qr);padding:12px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2px #33200f14}
.qr svg{display:block;width:100%;height:100%}
.foot{position:absolute;display:flex;align-items:center;justify-content:space-between}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:var(--facts);color:var(--muted);font-weight:600}
.facts span{display:inline-flex;align-items:center;gap:8px}
.facts svg{width:1.3em;height:1.3em;color:var(--accent)}
.signature{font-family:Parisienne,cursive;color:var(--rose);font-size:var(--sign);white-space:nowrap}
.og-cta{display:none}

/* ── 1080 x 1350: conversa e feed do WhatsApp ── */
.flyer{--w:1080px;--h:1350px;--logo:118px;--pill:20px;--kicker:19px;--h1:84px;--em:52px;--lede:25px;--gap:18px;--fig-h:330px;--fig-w:264px;--fig-h-main:400px;--fig-w-main:320px;--name:30px;--cta-pad:26px 26px 26px 34px;--btn-h:74px;--btn:29px;--offer:22px;--qr:170px;--where:27px;--where-sub:19px;--facts:19px;--sign:36px}
.flyer .top{left:70px;top:56px}
.flyer .title{left:70px;right:70px;top:208px}
.flyer .row{left:40px;right:40px;top:520px;height:470px}
.flyer .cta{left:70px;right:70px;top:1012px}
.flyer .foot{left:70px;right:70px;bottom:30px}
/* ── 1080 x 1920: Status e Stories (margens livres em cima e embaixo para a barra do Status) ── */
.status{--w:1080px;--h:1920px;--logo:136px;--pill:22px;--kicker:21px;--h1:96px;--em:60px;--lede:29px;--gap:22px;--fig-h:400px;--fig-w:320px;--fig-h-main:490px;--fig-w-main:392px;--name:34px;--cta-pad:32px 32px 32px 40px;--btn-h:96px;--btn:35px;--offer:25px;--qr:214px;--where:31px;--where-sub:22px;--facts:22px;--sign:44px}
.status .top{left:80px;top:150px}
.status .title{left:80px;right:80px;top:350px}
.status .row{left:30px;right:30px;top:750px;height:570px}
.status .cta{left:80px;right:80px;top:1380px}
.status .foot{left:80px;right:80px;top:1760px;flex-direction:column;align-items:flex-start;gap:8px}
/* ── 1200 x 630: prévia do link (og:image de fenda.html) ── */
.og{--w:1200px;--h:630px;--logo:82px;--pill:15px;--kicker:14px;--h1:60px;--em:38px;--lede:19px;--gap:12px;--fig-h:250px;--fig-w:200px;--fig-h-main:300px;--fig-w-main:240px;--name:21px;--btn-h:58px;--btn:20px}
.og .top{left:60px;top:40px;gap:16px}
.og .title{left:60px;top:150px;width:560px}
.og .row{left:600px;right:20px;top:110px;height:400px}
.og .og-cta{position:absolute;left:60px;bottom:44px;display:flex;align-items:center;gap:20px}
.og .og-cta strong{font-size:19px;font-weight:650}
.og :is(.cta,.foot){display:none}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="top"><div class="logo"><img src="assets/logo-ju.webp" alt=""></div><span class="badge">Novidade</span></div>
  <div class="title">
    <p class="kicker">Encaixe para</p>
    <h1>Lâmpada de fenda<em>O exame vira brincadeira.</em></h1>
    <p class="lede" id="lede"></p>
  </div>
  <div class="row" id="row"></div>
  <div class="cta">
    <div class="cta-text">
      <span class="button">Conheça a novidade <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></span>
      <span class="offer" id="offer"></span>
      <span class="where"><small>Toque no link da mensagem ou aponte a câmera</small><strong id="short"></strong></span>
    </div>
    <div class="qr" id="qr"></div>
  </div>
  <div class="og-cta"><span class="button">Conheça a novidade</span><strong id="offer-og"></strong></div>
  <div class="foot">
    <div class="facts">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Feito sob encomenda</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h12v13H2ZM14 9h4l4 4v4h-8"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>Envio para todo o Brasil</span>
    </div>
    <span class="signature">feito com carinho, pela Ju.</span>
  </div>
</div>
<script type="module">
import qrcode from './vendor/qrcode-generator.js';
import {PRODUCTS, FAMILIES} from './products.js';
import {COMMERCE, money, kitOffer} from './commerce-config.js';
import {fitFigure} from './escolha.js';
const params = new URLSearchParams(location.search);
const format = params.get('format') || 'flyer', url = params.get('url') || 'https://juimprimepramim.com.br/fenda';
document.getElementById('sheet').classList.add(format);
const items = FAMILIES.lampada.items.filter(key => PRODUCTS[key]), names = items.map(key => PRODUCTS[key].title);
// a do meio na frente: o macaco no centro, a girafa e o unicórnio dos lados
const order = [items[1], items[0], items[2]].filter(Boolean);
const price = COMMERCE.prices[items[0]];
document.getElementById('lede').innerHTML = `<b>${names.slice(0, -1).join(', ')} e ${names.at(-1)}</b>: capas impressas em 3D que se encaixam na lâmpada de fenda portátil e deixam o exame dos pequenos mais leve.`;
document.getElementById('row').innerHTML = order.map(key => `<div class="pick">${fitFigure(key, {lazy: false})}<span>${PRODUCTS[key].title}</span><small>${money(COMMERCE.prices[key])}</small></div>`).join('');
const offer = kitOffer(items[0]).replace(/,00/g, '');
document.getElementById('offer').innerHTML = `${money(price).replace(',00', '')} cada · <i>${offer}</i>`;
document.getElementById('offer-og').textContent = `${money(price).replace(',00', '')} cada · ${offer}`;
document.getElementById('short').textContent = url.replace(/^https?:\/\/(www\.)?/, '');
const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
const n = qr.getModuleCount(), cells = [];
for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) cells.push(`M${c} ${r}h1v1h-1z`);
document.getElementById('qr').innerHTML = `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path fill="#33200f" d="${cells.join('')}"/></svg>`;
await Promise.all(['500 64px "Playfair Display"', 'italic 500 64px "Playfair Display"', '400 20px "DM Sans"', '700 20px "DM Sans"', '40px Parisienne'].map(font => document.fonts.load(font)));
await Promise.all([...document.images].map(img => img.decode().catch(() => {})));
document.body.dataset.ready = '1';
</script>
</body>
</html>
