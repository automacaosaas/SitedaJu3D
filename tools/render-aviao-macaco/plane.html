const renderer = makeRenderer(SIZE, SIZE, {exposure: Number(P.exposure || 1.02)});
const scene = new THREE.Scene();
scene.environment = studioEnvironment(renderer, {top: Number(P.top || 5.5), left: Number(P.left || 3), right: Number(P.right || 2.4), scrim: Number(P.scrim || 1.5), glint: Number(P.glint ?? 16)});

const SPEC = {

  back:   {file: 'Airplane_BodyShellbACK_001', mat: plastic(C.body), at: [0, 0, 0]},
  glass:  {file: 'Cockpit_Windshield', mat: glassMat, at: [90, 122.2, -52]},
  pylons: {file: 'Engine_Pylons', mat: plastic(C.engines, .4, .4), at: [90, 90, -50]},
  stars:  {file: 'Wing_Stars', mat: plastic(C.details, .4, .4), at: [90, 112.5, -50]},
  nosef:  {file: 'NoseCone_Front', mat: plastic(C.details, .4, .4), at: [0, 0, Number(P.nz || 205)]},

const zUp = new THREE.Group(), root = new THREE.Group(); zUp.add(root);

// the STL camera looked along +y with z up: half a turn about the vertical so the front face (y = 104) faces −y …
root.position.set(90, 90, 0); root.rotation.z = Math.PI; root.children.forEach(m => m.position.sub(new THREE.Vector3(90, 90, 0)));
// … then the whole thing is turned to y up, the front toward +z (the camera of studio.js): (x, y, z) → (x, z, −y)
zUp.rotation.x = -Math.PI / 2; zUp.position.set(-90, 0, 90); scene.add(zUp); scene.updateMatrixWorld(true);
// The STL halves come in their print orientation: as placed so far the front half shows its flat inner face (magnet pockets, the shallow bed
// for the ruler) and the back half its rounded outer face. Assembled, the flat faces meet in the middle round the ruler and both rounded faces

scene.updateMatrixWorld(true);
const FLAT = {front: new THREE.Box3().setFromObject(mesh.front).max.z, back: new THREE.Box3().setFromObject(mesh.back).min.z};
function assemble(m, flat) {   // p → (−x, y, flat − z): the half turn, then the flat face back onto z = 0
  const pivot = new THREE.Group(); scene.add(pivot); pivot.attach(m);
  pivot.rotation.y = Math.PI; pivot.position.z = flat; pivot.updateMatrixWorld(true); return pivot;
}
assemble(mesh.front, FLAT.front); assemble(mesh.nosef, FLAT.front); assemble(mesh.back, FLAT.back); assemble(mesh.noseb, FLAT.back);
// the small parts were only ever translated, so they still share the front half's print orientation: give them the same half turn
for (const k of ["glass", "stars"]) assemble(mesh[k], FLAT.front);   // the engines stand on the wings either way: left as they were
// small parts keep facing the viewer; they move onto the rounded front (offsets in world millimetres, checked on oblique renders)
function nudge(m, dx, dy, dz) { const q = m.parent.getWorldQuaternion(new THREE.Quaternion()).invert(); m.position.add(new THREE.Vector3(dx, dy, dz).applyQuaternion(q)); }
nudge(mesh.glass, 0, Number(P.gy || 0), Number(P.gz || 0)); nudge(mesh.stars, 0, Number(P.sy || 0), Number(P.sz || 0)); nudge(mesh.pylons, 0, Number(P.py || 0), Number(P.pz || 0));
// grow a part about its own centre (world), so it fills its recess
function scaleAbout(m, s) {

  const c0 = new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()); m.scale.multiplyScalar(s); scene.updateMatrixWorld(true);
  const c1 = new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()); nudge(m, c0.x - c1.x, c0.y - c1.y, c0.z - c1.z);
}
scaleAbout(mesh.glass, Number(P.gs || 1));
scene.updateMatrixWorld(true);
// seat a part on the front: cast rays straight back from its vertices onto the front half and slide it along z until it just touches,
// then sink it by `embed` (the windows and the stars sit in their recesses)
function seat(m, embed) {
  const ray = new THREE.Raycaster(), p = m.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 400)); let gap = Infinity;
  for (let i = 0; i < p.count; i += step) {

    ray.set(new THREE.Vector3(v.x, v.y, 200), new THREE.Vector3(0, 0, -1)); const hit = ray.intersectObject(mesh.front, false)[0];

// the ray casts take half a minute in software WebGL: their result (gap before seating, mm) is kept here; ?reseat=1 measures again
const GAPS = {glass: -27.56, stars: -11.32}, sit = (k, embed) => { if (P.reseat) return seat(mesh[k], embed); nudge(mesh[k], 0, 0, -GAPS[k] - embed); scene.updateMatrixWorld(true); return GAPS[k]; };
const seated = {stars: sit("stars", Number(P.sembed ?? .5))};
window.FLAT = FLAT;

// ── height fields: the outermost surface of a part seen along z (over x, y) or along y (over x, z), rasterised from its triangles ──

  const p = m.geometry.attributes.position, a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  scene.updateMatrixWorld(true);
  for (let t = 0; t + 2 < p.count; t += 3) {
    a.fromBufferAttribute(p, t).applyMatrix4(m.matrixWorld); b.fromBufferAttribute(p, t + 1).applyMatrix4(m.matrixWorld); c.fromBufferAttribute(p, t + 2).applyMatrix4(m.matrixWorld);
    const lu = Math.min(a[U], b[U], c[U]), hu = Math.max(a[U], b[U], c[U]), lv = Math.min(a[V], b[V], c[V]), hv = Math.max(a[V], b[V], c[V]);
    if (hu < u0 || lu > u1 || hv < v0 || lv > v1) continue;
    const den = (b[V] - c[V]) * (a[U] - c[U]) + (c[U] - b[U]) * (a[V] - c[V]); if (Math.abs(den) < 1e-9) continue;
    for (let iu = Math.max(0, Math.ceil((lu - u0) / cell)); iu <= Math.min(nu - 1, Math.floor((hu - u0) / cell)); iu++) for (let iv = Math.max(0, Math.ceil((lv - v0) / cell)); iv <= Math.min(nv - 1, Math.floor((hv - v0) / cell)); iv++) {
      const u = u0 + iu * cell, v = v0 + iv * cell, w1 = ((b[V] - c[V]) * (u - c[U]) + (c[U] - b[U]) * (v - c[V])) / den, w2 = ((c[V] - a[V]) * (u - c[U]) + (a[U] - c[U]) * (v - c[V])) / den, w3 = 1 - w1 - w2;
      if (w1 < -1e-6 || w2 < -1e-6 || w3 < -1e-6) continue;

}
// The cockpit windows: the STL part is a plug for the two openings in the nose, but it is flat where the nose is curved, so as it came it
// stood proud of the body and sat low. Its outline is moved up and stretched onto the openings (dy, sy, measured on the front render); then
// the outer surface of the nose is fitted across the openings (a quadratic surface through the shell round them) and the plug's front face
// is laid on it, its body kept `depth` deep behind: the windows follow the nose and sit flush, like the printed ones.

  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(mw); world[i * 3] = cx + (v.x - cx) * sx; world[i * 3 + 1] = cy + (v.y - cy) * sy + dy; world[i * 3 + 2] = v.z; }
  const moved = new THREE.Mesh(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(world, 3)));   // in world coordinates
  const b = new THREE.Box3().setFromObject(moved), u0 = b.min.x - 6, u1 = b.max.x + 6, v0 = b.min.y - 6, v1 = b.max.y + 6;
  const back = heightField(moved, 'z', u0, u1, v0, v1, {keep: 'min'}), front = heightField(moved, 'z', u0, u1, v0, v1, {keep: 'max'});
  const outer = heightField(mesh.front, 'z', u0, u1, v0, v1);

  // the strong curve at the top of the nose, outside the openings themselves

  const ox = (b.min.x + b.max.x) / 2, oy = (b.min.y + b.max.y) / 2, terms = (x, y) => { const X = (x - ox) / 20, Y = (y - oy) / 20; return [1, X, Y, X * X, X * Y, Y * Y, X * X * X, X * X * Y, X * Y * Y, Y * Y * Y]; };

  const fit = pts => {
    const n = 10, A = Array.from({length: n}, () => new Float64Array(n)), r = new Float64Array(n);

    for (let i = 0; i < n; i++) { let k = i; for (let j = i + 1; j < n; j++) if (Math.abs(A[j][i]) > Math.abs(A[k][i])) k = j; [A[i], A[k]] = [A[k], A[i]]; [r[i], r[k]] = [r[k], r[i]];

drape(mesh.glass, {dy: Number(P.gdy ?? 3.85), sy: Number(P.gsy ?? 1.13), sx: Number(P.gsx ?? 1), depth: Number(P.gdepth ?? .04), lift: Number(P.glift ?? .2)});   // a thin pane just over the skin: the plug's walls collapse and never show
// The nose cap halves were placed by hand too high: each one comes down onto the top of its half until it touches (embed: a hair into it)
function capOn(m, shell, embed = .15) {
  scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(m), top = heightField(shell, 'y', box.min.x - 1, box.max.x + 1, box.min.z - 1, box.max.z + 1, {cell: .25});
  const p = m.geometry.attributes.position, v = new THREE.Vector3(); let gap = Infinity;
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld); const h = top(v.x, v.z); if (Number.isFinite(h)) gap = Math.min(gap, v.y - h); }

// the two halves of the cap meet on the plane where the airplane halves meet (they came 4.8 mm off it, leaving a gap in the middle)
for (const [m, s] of [[mesh.nosef, -1], [mesh.noseb, 1]]) { const b = new THREE.Box3().setFromObject(m); nudge(m, 0, 0, s > 0 ? -b.max.z : -b.min.z); }

// world from here on: x right (body centre x = 0), y up, the halves meet at z = 0, the front bulges toward +z

// ── measured on the STL: 16 through holes, 2 columns × 8 rows, Ø 16.28, relative to the body centre (height 105.243) ──
const CY = 105.243, COL = [-9.68, 9.62], ROW0 = 47.55, PITCH = 19.49, HOLE_D = 16.28, FRONT = 14;
const LABELS = [['0.5', '1', '1.5', '2', '2.5', '3', '3.5', '4'], ['5', '6', '7', '8', '9', '10', '12', '15']];
// engraved numbers beside the holes (the STL has none): same plastic, shown by relief and a hairline of shade

const box = new THREE.Box3(); for (const k of ['front', 'back', 'glass', 'pylons', 'stars', 'nosef']) box.expandByObject(mesh[k]);
