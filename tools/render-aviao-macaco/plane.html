<!doctype html>
<meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
<body style="margin:0;background:#777"><script type="module">
// Aviãoscopia from the real STL parts (project of 21/08/2026) in the studio of studio.js, with the degree ruler of ruler.js. One camera for
// every layer, so they register pixel for pixel:
//   full = both shells assembled (vitrine and catalogue)   front = front shell with its parts   back = back shell, seen through the front
//   ruler = the ruler at its assembled place, on a taller canvas (the grip hangs below)   inuse = assembled with the ruler inside (check view)
// ?orbit=az,el turns the camera round the model to check where the small parts sit.
import * as THREE from 'three';
import {toCreasedNormals} from '/vendor/utils/BufferGeometryUtils.js';
import {makeRenderer, studioEnvironment, renderStudio, finish, cropToContent, artBox} from './studio.js';
import {buildRuler, RULER} from './ruler.js';

const P = Object.fromEntries(new URLSearchParams(location.search));
const SIZE = Number(P.size || 1254), PASSES = Number(P.passes || 40), RULER_H = Number(P.rulerh || 1850);
const C = {body: P.body || '#123aa6', details: P.details || '#d0142f', engines: P.engines || '#f5ae0a', glass: P.glass || '#eef3f6'};

async function stl(name) {
  const buf = await (await fetch('/stl/Airplane Oftalmology_' + name + '.stl')).arrayBuffer(), dv = new DataView(buf), n = dv.getUint32(80, true), pos = new Float32Array(n * 9);
  for (let t = 0; t < n; t++) for (let v = 0; v < 3; v++) for (let k = 0; k < 3; k++) pos[t * 9 + v * 3 + k] = dv.getFloat32(84 + t * 50 + 12 + v * 12 + k * 4, true);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return toCreasedNormals(g, Number(P.crease || 32) * Math.PI / 180);
}

const renderer = makeRenderer(SIZE, SIZE, {exposure: Number(P.exposure || 1.02)});
const scene = new THREE.Scene();
scene.environment = studioEnvironment(renderer, {top: Number(P.top || 5.5), left: Number(P.left || 3), right: Number(P.right || 2.4), scrim: Number(P.scrim || 1.5), glint: Number(P.glint ?? 16)});
const plastic = (hex, rough = .42, coat = .32) => new THREE.MeshPhysicalMaterial({color: new THREE.Color(hex), roughness: rough, clearcoat: coat, clearcoatRoughness: .38, envMapIntensity: .9});
const glassMat = new THREE.MeshPhysicalMaterial({color: new THREE.Color(C.glass), roughness: .22, clearcoat: 1, clearcoatRoughness: .08, envMapIntensity: 1.4});

// STL frames: the shells are in body space (centre x = y = 90, front face y = 104); the small parts are modelled round the origin and placed by hand
const SPEC = {
  front:  {file: 'Airplane_BodyShell_001', mat: plastic(C.body), at: [0, 0, 0]},
  back:   {file: 'Airplane_BodyShellbACK_001', mat: plastic(C.body), at: [0, 0, 0]},
  glass:  {file: 'Cockpit_Windshield', mat: glassMat, at: [90, 122.2, -52]},
  pylons: {file: 'Engine_Pylons', mat: plastic(C.engines, .4, .4), at: [90, 90, -50]},
  stars:  {file: 'Wing_Stars', mat: plastic(C.details, .4, .4), at: [90, 112.5, -50]},
  nosef:  {file: 'NoseCone_Front', mat: plastic(C.details, .4, .4), at: [0, 0, Number(P.nz || 205)]},
  noseb:  {file: 'NoseCone_Back', mat: plastic(C.details, .4, .4), at: [0, 0, Number(P.nz || 205)]}
};
const zUp = new THREE.Group(), root = new THREE.Group(); zUp.add(root);
const mesh = {};
for (const [key, s] of Object.entries(SPEC)) { const m = new THREE.Mesh(await stl(s.file), s.mat); m.position.set(...s.at); m.castShadow = m.receiveShadow = true; root.add(m); mesh[key] = m; }
// the STL camera looked along +y with z up: half a turn about the vertical so the front face (y = 104) faces −y …
root.position.set(90, 90, 0); root.rotation.z = Math.PI; root.children.forEach(m => m.position.sub(new THREE.Vector3(90, 90, 0)));
// … then the whole thing is turned to y up, the front toward +z (the camera of studio.js): (x, y, z) → (x, z, −y)
zUp.rotation.x = -Math.PI / 2; zUp.position.set(-90, 0, 90); scene.add(zUp); scene.updateMatrixWorld(true);
// The STL halves come in their print orientation: as placed so far the front half shows its flat inner face (magnet pockets, the shallow bed
// for the ruler) and the back half its rounded outer face. Assembled, the flat faces meet in the middle round the ruler and both rounded faces
// look out: turn each half a half turn about the vertical and slide it so its flat face sits on z = 0.
scene.updateMatrixWorld(true);
const FLAT = {front: new THREE.Box3().setFromObject(mesh.front).max.z, back: new THREE.Box3().setFromObject(mesh.back).min.z};
function assemble(m, flat) {   // p → (−x, y, flat − z): the half turn, then the flat face back onto z = 0
  const pivot = new THREE.Group(); scene.add(pivot); pivot.attach(m);
  pivot.rotation.y = Math.PI; pivot.position.z = flat; pivot.updateMatrixWorld(true); return pivot;
}
assemble(mesh.front, FLAT.front); assemble(mesh.nosef, FLAT.front); assemble(mesh.back, FLAT.back); assemble(mesh.noseb, FLAT.back);
// the small parts were only ever translated, so they still share the front half's print orientation: give them the same half turn
for (const k of ["glass", "stars"]) assemble(mesh[k], FLAT.front);   // the engines stand on the wings either way: left as they were
// small parts keep facing the viewer; they move onto the rounded front (offsets in world millimetres, checked on oblique renders)
function nudge(m, dx, dy, dz) { const q = m.parent.getWorldQuaternion(new THREE.Quaternion()).invert(); m.position.add(new THREE.Vector3(dx, dy, dz).applyQuaternion(q)); }
nudge(mesh.glass, 0, Number(P.gy || 0), Number(P.gz || 0)); nudge(mesh.stars, 0, Number(P.sy || 0), Number(P.sz || 0)); nudge(mesh.pylons, 0, Number(P.py || 0), Number(P.pz || 0));
scene.updateMatrixWorld(true);
// seat a part on the front: cast rays straight back from its vertices onto the front half and slide it along z until it just touches,
// then sink it by `embed` (the windows and the stars sit in their recesses)
function seat(m, embed) {
  const ray = new THREE.Raycaster(), p = m.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 400)); let gap = Infinity;
  for (let i = 0; i < p.count; i += step) {
    const v = new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld);
    ray.set(new THREE.Vector3(v.x, v.y, 200), new THREE.Vector3(0, 0, -1)); const hit = ray.intersectObject(mesh.front, false)[0];
    if (hit) gap = Math.min(gap, v.z - hit.point.z);
  }
  if (gap < Infinity) nudge(m, 0, 0, -gap - embed);
  scene.updateMatrixWorld(true); return +gap.toFixed(2);
}
// the ray casts take half a minute in software WebGL: their result (gap before seating, mm) is kept here; ?reseat=1 measures again
const GAPS = {glass: -27.56, stars: -11.32}, sit = (k, embed) => { if (P.reseat) return seat(mesh[k], embed); nudge(mesh[k], 0, 0, -GAPS[k] - embed); scene.updateMatrixWorld(true); return GAPS[k]; };
const seated = {glass: sit("glass", Number(P.gembed ?? 3.5)), stars: sit("stars", Number(P.sembed ?? .5))};
window.FLAT = FLAT;
// world from here on: x right (body centre x = 0), y up, the halves meet at z = 0, the front bulges toward +z

// ── measured on the STL: 16 through holes, 2 columns × 8 rows, Ø 16.28, relative to the body centre (height 105.243) ──
const CY = 105.243, COL = [-9.68, 9.62], ROW0 = 47.55, PITCH = 19.49, HOLE_D = 16.28, FRONT = 14;
const LABELS = [['0.5', '1', '1.5', '2', '2.5', '3', '3.5', '4'], ['5', '6', '7', '8', '9', '10', '12', '15']];
// engraved numbers beside the holes (the STL has none): same plastic, shown by relief and a hairline of shade
function numbersDecal() {
  const PXMM = 16, Wd = 90, Hd = 170, W = Math.round(Wd * PXMM), H = Math.round(Hd * PXMM), c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, W, H); x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.font = `600 ${6.2 * PXMM}px "Bahnschrift", Arial, sans-serif`;
  const gx = mm => W / 2 + mm * PXMM, gy = mm => H / 2 - (mm + 20) * PXMM;
  for (let side = 0; side < 2; side++) for (let r = 0; r < 8; r++) { x.textAlign = side === 0 ? 'right' : 'left'; x.fillText(LABELS[side][r], gx(COL[side] + (side === 0 ? -1 : 1) * (HOLE_D / 2 + 2.2)), gy(ROW0 - r * PITCH) + PXMM * .25); }
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 16; tex.colorSpace = THREE.NoColorSpace;
  const mat = new THREE.MeshPhysicalMaterial({color: new THREE.Color(C.body).multiplyScalar(.5), roughness: .6, bumpMap: tex, bumpScale: Number(P.bump || 3), alphaMap: tex, transparent: true, opacity: Number(P.numop || 0), depthWrite: false, envMapIntensity: .9});
  const m = new THREE.Mesh(new THREE.PlaneGeometry(Wd, Hd), mat); m.position.set(0, CY - 20, Number(P.numz || 10)); m.renderOrder = 5; return m;
}
const decal = numbersDecal(); scene.add(decal);

// the ruler: its lenses on the holes, centred between the two flat faces
const ruler = buildRuler({acr: .05}); ruler.position.set(-(COL[0] + COL[1]) / 2, CY + ROW0 - RULER.ROW0, Number(P.ruler_z || 0)); scene.add(ruler);   // x: the halves are mirrored by the half turn

// ── camera ─────────────────────────────────────────────────────────────────────────────
const box = new THREE.Box3(); for (const k of ['front', 'back', 'glass', 'pylons', 'stars', 'nosef']) box.expandByObject(mesh[k]);
const fov = Number(P.fov || 12), camera = new THREE.PerspectiveCamera(fov, 1, 10, 20000);
const verts = []; for (const k of ['front', 'back', 'pylons', 'nosef']) { const o = mesh[k], p = o.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 6000)); for (let i = 0; i < p.count; i += step) verts.push(new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld)); }
function place(az, el, fitH, fitB) {
  const target = box.getCenter(new THREE.Vector3()); let dist = (box.max.y - box.min.y) / fitH / 2 / Math.tan(fov * Math.PI / 360);
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  for (let it = 0; it < 8; it++) {
    camera.position.copy(target).addScaledVector(dir, dist); camera.lookAt(target); camera.updateMatrixWorld();
    let lo = Infinity, hi = -Infinity; for (const v of verts) { const y = v.clone().project(camera).y; lo = Math.min(lo, y); hi = Math.max(hi, y); }
    const wantLo = -1 + 2 * fitB, wantHi = -1 + 2 * (fitB + fitH);
    dist *= (hi - lo) / (wantHi - wantLo); target.y += ((hi + lo) / 2 - (wantHi + wantLo) / 2) * dist * Math.tan(fov * Math.PI / 360) / Math.cos(el);
  }
  camera.position.copy(target).addScaledVector(dir, dist); camera.lookAt(target); camera.updateMatrixWorld();
}
const [az, el] = (P.orbit || `0,${P.elev || 5}`).split(',').map(v => Number(v) * Math.PI / 180);
const vitrine = () => place(az, el, Number(P.h || .8933), Number(P.bottom || .076));
vitrine();

// popup picture: the airplane on the white pillar, on the page's light grey, with a soft contact shadow on an unseen floor
const PED = {r: Number(P.radius || 96), h: Number(P.ph || 110), elev: Number(P.pelev || 8.5), fill: Number(P.pfill || .9)};
const pillar = new THREE.Mesh(new THREE.CylinderGeometry(PED.r, PED.r, PED.h, 192), new THREE.MeshPhysicalMaterial({color: 0xf6f6f4, roughness: .55, clearcoat: .1, envMapIntensity: .9}));
pillar.position.set(0, box.min.y - PED.h / 2, 4); pillar.castShadow = pillar.receiveShadow = true; pillar.visible = false; scene.add(pillar);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.ShadowMaterial({opacity: .22})); floor.rotation.x = -Math.PI / 2; floor.position.y = box.min.y - PED.h; floor.receiveShadow = true; floor.visible = false; if (P.pfloor) scene.add(floor);   // off: the key light's shadow on it is too hard
function pedCamera() {
  const e = PED.elev * Math.PI / 180, top = box.max.y, low = box.min.y - PED.h, frameH = (top - low) / PED.fill, dist = frameH / 2 / Math.tan(fov * Math.PI / 360);
  const target = new THREE.Vector3(0, (top + low) / 2, 0); camera.position.copy(target).add(new THREE.Vector3(0, Math.sin(e), Math.cos(e)).multiplyScalar(dist)); camera.lookAt(target); camera.updateMatrixWorld();
}

const SHOW = {full: ['front', 'back', 'glass', 'pylons', 'stars', 'nosef', 'decal'], front: ['front', 'glass', 'pylons', 'stars', 'nosef', 'decal'], back: ['back', 'noseb'],
  ruler: ['ruler'], inuse: ['front', 'back', 'glass', 'pylons', 'stars', 'nosef', 'decal', 'ruler'], card: ['front', 'back', 'glass', 'pylons', 'stars', 'nosef'], ped: ['front', 'back', 'glass', 'pylons', 'stars', 'nosef', 'pillar']};
const out = {}, info = {seated};
for (const name of (P.variants || 'full').split(',')) {
  const shown = new Set(SHOW[name]);
  for (const [k, m] of Object.entries(mesh)) m.visible = shown.has(k);
  decal.visible = shown.has('decal') && Number(P.numop || 0) > 0;   // the STL has the numbers engraved; the decal is only a fallback
  ruler.visible = shown.has('ruler');
  pillar.visible = floor.visible = shown.has('pillar');
  if (name === 'card') place(az, el, Number(P.ch || .93), Number(P.cb || .035)); else if (name === 'ped') pedCamera(); else vitrine();
  const tall = name === 'ruler' || name === 'inuse', W = name === 'card' ? Number(P.csize || 768) : SIZE, H = tall ? RULER_H : W;
  renderer.setSize(W, H);
  let c = renderStudio(renderer, scene, camera, {width: W, height: H, passes: PASSES, subject: tall || name === 'ped' ? scene : zUp, view: {fullWidth: W, fullHeight: W, x: 0, y: 0},
    key: {dir: [Number(P.kx ?? -.5), Number(P.ky ?? .72), Number(P.kz ?? .7)], spread: Number(P.spread || .3), intensity: Number(P.key || 1.6), distance: Number(P.kdist ?? 4)},
    dome: {intensity: Number(P.dome || 1.1), minElevation: -.1}, shadowMap: 4096});
  if (name === 'ped') {   // opaque: a soft vertical grey behind
    const bg = document.createElement('canvas'); bg.width = W; bg.height = H; const g = bg.getContext('2d'), grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, P.bg0 || '#f2f3f5'); grad.addColorStop(1, P.bg1 || '#e5e7eb'); g.fillStyle = grad; g.fillRect(0, 0, W, H); g.drawImage(c, 0, 0); c = bg;
  }
  if (name === 'ruler') {   // trimmed; its place on the square picture, for products.js (tool: width, top, ratio)
    const {canvas, box: b} = cropToContent(c); c = canvas;
    info.ruler = {width: +(b.w / SIZE).toFixed(4), top: +(b.y / SIZE).toFixed(4), ratio: +(b.w / b.h).toFixed(4), shift: +((b.x + b.w / 2) / SIZE - .5).toFixed(4), px: [b.w, b.h]};
  }
  if (name === 'full' || name === 'card') info[name] = artBox(c);
  out[name] = c;
}
vitrine();
const toPx = v => { camera.clearViewOffset(); const q = v.clone().project(camera); return [+((q.x + 1) / 2).toFixed(4), +((1 - q.y) / 2).toFixed(4)]; };
// where the parts are on the square picture (fractions), for the callouts
info.anchors = {plateTop: toPx(new THREE.Vector3(0, ruler.position.y, ruler.position.z)), gripTop: toPx(new THREE.Vector3(0, ruler.position.y + RULER.GRIP_TOP, ruler.position.z)), wingL: toPx(new THREE.Vector3(-52, CY - 8, 6)), nose: toPx(new THREE.Vector3(0, box.max.y - 6, 10))};
finish(out, info);
</script>
