<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#ccd"><script type="module">
// Macacoscópio assets from the owner's photos (provisional until the model/new photos exist):
//   monkey = vitrine cutout (hand-held photo, 1254² like the other pieces)   base = equipment body + black column (rises into the monkey)   head = equipment head + stem (comes down on top)
//   preview = the stack assembled and exploded on a light background, to judge the registration
const P7 = '/photos/WhatsApp%20Image%202026-09-30%20at%2023.28.15.jpeg', P18 = '/photos/WhatsApp%20Image%202026-09-30%20at%2023.28.16.jpeg';
const load = url => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('load ' + url)); i.src = url; });
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h); return c; };
const px = c => c.getContext('2d', {willReadFrequently: true});
const luma = (d, i) => .2126 * d[i] + .7152 * d[i + 1] + .0722 * d[i + 2];

// ── sizes of the shared frame (the vitrine square) ───────────────────────────────────────────
const FRAME = 1254, MONKEY_H = Math.round(.87 * FRAME), MONKEY_BOTTOM = Math.round((1 - .055) * FRAME), XC = FRAME / 2;
const H18 = 428, F = MONKEY_H / H18;                 // frame px per px of the mounted photo (#18): its monkey is 428 px tall
const K = 1.5;                                        // storage scale of the device assets, in px of the mounted photo

// ── 1 · the monkey, from the hand-held photo ─────────────────────────────────────────────────
async function monkey() {
  const img = await load(P7), W = img.naturalWidth, H = img.naturalHeight, c = canvas(W, H), x = px(c); x.drawImage(img, 0, 0);
  const data = x.getImageData(0, 0, W, H), d = data.data, bg = new Uint8Array(W * H), stack = [];
  // background = what the wall flood reaches from the borders: light pixels, changing slowly from one pixel to the next
  const join = (p, q) => { if (bg[q]) return; const a = p * 4, b = q * 4, diff = Math.hypot(d[a] - d[b], d[a + 1] - d[b + 1], d[a + 2] - d[b + 2]); if (luma(d, b) > 120 && diff < 11) { bg[q] = 1; stack.push(q); } };
  const seed = p => { if (!bg[p] && luma(d, p * 4) > 120) { bg[p] = 1; stack.push(p); } };
  for (let i = 0; i < W; i++) { seed(i); seed((H - 1) * W + i); } for (let j = 0; j < H; j++) { seed(j * W); seed(j * W + W - 1); }
  while (stack.length) { const p = stack.pop(), xx = p % W; if (xx > 0) join(p, p - 1); if (xx < W - 1) join(p, p + 1); if (p >= W) join(p, p - W); if (p < W * (H - 1)) join(p, p + W); }
  // keep the monkey only: a polygon that follows the tube (the thumb under it and its tip at the right are left out)
  const poly = [[240, 420], [660, 420], [660, 912], [541, 912], [537, 965], [530, 978], [515, 990], [485, 1000], [440, 1003], [395, 999], [368, 990], [350, 978], [340, 965], [338, 912], [240, 912]];
  const pm = canvas(W, H), pg = px(pm); pg.fillStyle = '#fff'; pg.beginPath(); poly.forEach(([a, b], i) => i ? pg.lineTo(a, b) : pg.moveTo(a, b)); pg.fill();
  const pd = pg.getImageData(0, 0, W, H).data, alpha = new Uint8ClampedArray(W * H);
  // only the component that touches the tube centre
  const keep = new Uint8Array(W * H), st = [], start = 760 * W + 440; keep[start] = 1; st.push(start);
  const fg = p => !bg[p] && pd[p * 4 + 3] > 128;
  while (st.length) { const p = st.pop(), xx = p % W; for (const q of [xx > 0 ? p - 1 : -1, xx < W - 1 ? p + 1 : -1, p - W, p + W]) if (q >= 0 && q < W * H && !keep[q] && fg(q)) { keep[q] = 1; st.push(q); } }
  // close the small holes inside (white eye highlights, the banana) — everything enclosed stays opaque: fill the background-from-outside complement
  for (let p = 0; p < W * H; p++) alpha[p] = keep[p] ? 255 : 0;
  // soften: erode by one pixel (drops the light fringe of the wall), then blur a hair
  const er = new Uint8ClampedArray(alpha); for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) { const p = y * W + xx; if (alpha[p] && (!alpha[p - 1] || !alpha[p + 1] || !alpha[p - W] || !alpha[p + W])) er[p] = 0; }
  // opening (erode 3 px, grow back 3 px): hairs and fuzz hanging off the print disappear, the shape keeps its size
  const box = (src, r, grow) => { const o = new Uint8ClampedArray(src.length); for (let y = r; y < H - r; y++) for (let xx = r; xx < W - r; xx++) { let hit = grow ? 0 : 1; for (let dy = -r; dy <= r && (grow ? !hit : hit); dy++) for (let dx = -r; dx <= r; dx++) { const v = src[(y + dy) * W + xx + dx] > 0; if (grow ? v : !v) { hit = grow ? 1 : 0; break; } } o[y * W + xx] = hit ? 255 : 0; } return o; };
  const opened = box(box(er, 3, false), 3, true); for (let p = 0; p < W * H; p++) er[p] = opened[p] && alpha[p] ? 255 : 0;
  for (let p = 0; p < W * H; p++) d[p * 4 + 3] = er[p];
  x.putImageData(data, 0, 0);
  let l = W, r = -1, t = H, bt = -1; for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) if (er[y * W + xx]) { if (xx < l) l = xx; if (xx > r) r = xx; if (y < t) t = y; if (y > bt) bt = y; }
  const bw = r - l + 1, bh = bt - t + 1, s = MONKEY_H / bh;
  // alpha feather through a blurred copy of the mask (1 source px), drawn scaled into the frame
  const mask = canvas(W, H), mg = px(mask); const md = mg.createImageData(W, H); for (let p = 0; p < W * H; p++) { md.data[p * 4] = md.data[p * 4 + 1] = md.data[p * 4 + 2] = 255; md.data[p * 4 + 3] = er[p]; } mg.putImageData(md, 0, 0);
  const soft = canvas(W, H), sg = px(soft); sg.filter = 'blur(.9px)'; sg.drawImage(mask, 0, 0); sg.filter = 'none';
  sg.globalCompositeOperation = 'source-in'; sg.drawImage(c, 0, 0);   // colour from the photo where the softened mask is opaque
  const out = canvas(FRAME, FRAME), og = px(out); og.imageSmoothingQuality = 'high';
  const dx = XC - bw * s / 2, dy = MONKEY_BOTTOM - bh * s;
  og.drawImage(soft, l, t, bw, bh, dx, dy, bw * s, bh * s);
  // a little sharpness back after the 2× upscale (unsharp mask on the colour)
  const od = og.getImageData(0, 0, FRAME, FRAME), blur = canvas(FRAME, FRAME), bg2 = px(blur); bg2.drawImage(out, 0, 0); bg2.filter = 'blur(1.6px)'; bg2.drawImage(out, 0, 0);
  const bd = bg2.getImageData(0, 0, FRAME, FRAME).data;
  for (let p = 0; p < FRAME * FRAME; p++) { const i = p * 4; if (od.data[i + 3] > 200) for (let k = 0; k < 3; k++) od.data[i + k] = Math.max(0, Math.min(255, od.data[i + k] + (od.data[i + k] - bd[i + k]) * .55)); }
  og.putImageData(od, 0, 0);
  return {out, box: {l, t, bw, bh, s, dx, dy}};
}

// ── 2 · the equipment, from the mounted photo ────────────────────────────────────────────────
const poly = (g, pts) => { g.beginPath(); pts.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); g.closePath(); };

async function base(img) {
  // body with the black rings and the two feet (x 239–689, y 792–992 of the mounted photo), plus a black column on top
  const x0 = 239, x1 = 689, y0 = 792, y1 = 992, colH = 275, W = (x1 - x0) * K, H = (colH + (y1 - y0)) * K;
  const out = canvas(W, H), g = px(out);
  // column: matte black cylinder, lighter in the middle, slightly left
  const cw = 126 * K, cx = (464.5 - x0) * K, grad = g.createLinearGradient(cx - cw / 2, 0, cx + cw / 2, 0);
  grad.addColorStop(0, '#0c0c0e'); grad.addColorStop(.28, '#2a2b2f'); grad.addColorStop(.5, '#1d1e21'); grad.addColorStop(1, '#09090a');
  g.fillStyle = grad; g.fillRect(cx - cw / 2, 0, cw, colH * K + 4);
  // collar: the top of the white body around the column, so nothing dark shows under the monkey's curved bottom edge
  const collar = g.createLinearGradient(0, (colH - 14) * K, 0, colH * K + 6); collar.addColorStop(0, '#e9ebee'); collar.addColorStop(1, '#d3d6db');
  g.fillStyle = collar; g.beginPath(); g.roundRect((464.5 - 78 - x0) * K, (colH - 14) * K, 156 * K, 22 * K, 5 * K); g.fill();
  // the equipment body: photo pixels inside a hand-drawn outline (source px → asset px)
  const src = canvas(W, (y1 - y0) * K), sg = px(src); sg.imageSmoothingQuality = 'high'; sg.drawImage(img, x0, y0, x1 - x0, y1 - y0, 0, 0, W, (y1 - y0) * K);
  const shape = [[350, 794], [392, 794], [545, 794], [584, 799], [586, 815], [586, 850], [585, 900], [583, 950], [574, 962], [548, 968], [546, 992], [362, 992], [362, 978], [352, 962], [343, 950], [343, 880], [344, 845], [347, 812]];
  const feetL = [[285, 884], [343, 884], [343, 960], [362, 990], [285, 974], [250, 964], [243, 935], [250, 900], [262, 892]], feetR = [[585, 892], [615, 893], [628, 905], [634, 935], [630, 970], [590, 983], [548, 988], [570, 962], [585, 952]];
  const m = canvas(W, (y1 - y0) * K), mg = px(m); mg.fillStyle = '#fff';
  for (const p of [shape, feetL, feetR]) { poly(mg, p.map(([a, b]) => [(a - x0) * K, (b - y0) * K])); mg.fill(); }
  const mm = canvas(W, (y1 - y0) * K), mmg = px(mm); mmg.filter = 'blur(1.1px)'; mmg.drawImage(m, 0, 0); mmg.filter = 'none';
  sg.globalCompositeOperation = 'destination-in'; sg.drawImage(mm, 0, 0);
  g.drawImage(src, 0, colH * K);
  return {out, colH, w: x1 - x0, h: colH + (y1 - y0)};
}

async function head(img) {
  // head + stem (x 291–701, y 188–402 of the mounted photo). Above the monkey's top edge the photo is used; below it (hidden behind the monkey in the final
  // position) the underside of the head is painted, and the stem continues down as a plug.
  const x0 = 291, x1 = 701, y0 = 188, y1 = 402, W = (x1 - x0) * K, H = (y1 - y0) * K;
  const out = canvas(W, H), g = px(out), P = ([a, b]) => [(a - x0) * K, (b - y0) * K];
  const outline = [[322, 272], [326, 252], [338, 232], [354, 213], [376, 200], [404, 194], [432, 194], [470, 199], [500, 203], [530, 198], [560, 196], [590, 208], [612, 228], [626, 255], [632, 285], [635, 320], [633, 345], [626, 366], [612, 380], [580, 394], [530, 401], [480, 402], [430, 400], [385, 392], [350, 378], [333, 364], [322, 347], [317, 325], [318, 300]];
  // 1 photo above the monkey cap (y < 366 flat, ears excluded), 2 painted underside below
  const src = canvas(W, H), sg = px(src); sg.imageSmoothingQuality = 'high'; sg.drawImage(img, x0, y0, x1 - x0, y1 - y0, 0, 0, W, H);
  // underside: warm white that darkens toward the lowest point; seam blended
  const under = canvas(W, H), ug = px(under), ugrad = ug.createLinearGradient(0, (352 - y0) * K, 0, (402 - y0) * K);
  ugrad.addColorStop(0, '#d9d8d5'); ugrad.addColorStop(.6, '#bfbebb'); ugrad.addColorStop(1, '#9c9b99'); ug.fillStyle = ugrad; ug.fillRect(0, (352 - y0) * K, W, (y1 - 352) * K);
  // stem plug continues below the head's bottom edge (black, under the monkey)
  const stemGrad = ug.createLinearGradient((497 - x0) * K, 0, (538 - x0) * K, 0); stemGrad.addColorStop(0, '#0c0c0e'); stemGrad.addColorStop(.5, '#26272b'); stemGrad.addColorStop(1, '#0a0a0b');
  // compose: photo on top of the underside, with the photo faded out over the last 8 px above the monkey's top edge
  const body = canvas(W, H), bg = px(body); bg.drawImage(under, 0, 0);
  const keepTop = canvas(W, H), kg = px(keepTop); kg.drawImage(src, 0, 0);
  const fade = kg.createLinearGradient(0, (356 - y0) * K, 0, (368 - y0) * K); fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  kg.globalCompositeOperation = 'destination-in'; kg.fillStyle = fade; kg.fillRect(0, 0, W, H); kg.globalCompositeOperation = 'source-over';
  bg.drawImage(keepTop, 0, 0);
  bg.fillStyle = stemGrad; bg.fillRect((497 - x0) * K, (362 - y0) * K, 41 * K, 40 * K);
  // alpha: the outline, a hair of feather
  const mask = canvas(W, H), mg = px(mask); mg.fillStyle = '#fff'; poly(mg, outline.map(P)); mg.fill();
  const soft = canvas(W, H), sg2 = px(soft); sg2.filter = 'blur(1.2px)'; sg2.drawImage(mask, 0, 0); sg2.filter = 'none';
  bg.globalCompositeOperation = 'destination-in'; bg.drawImage(soft, 0, 0);
  g.drawImage(body, 0, 0);
  return {out, w: x1 - x0, h: y1 - y0};
}

// ── preview: the stack in the frame (assembled / exploded) ───────────────────────────────────
function preview(m, b, h, lift = 0, drop = 0, headUp = 0) {
  const topPad = 500, botPad = 700, c = canvas(FRAME, FRAME + topPad + botPad), g = px(c);
  const bgd = g.createLinearGradient(0, 0, 0, c.height); bgd.addColorStop(0, '#eaf6fb'); bgd.addColorStop(1, '#bfdff0'); g.fillStyle = bgd; g.fillRect(0, 0, c.width, c.height);
  const baseTop = MONKEY_BOTTOM - 6 * F + drop;                  // base top: 6 px (of the mounted photo) under the monkey's bottom edge
  const colTop = baseTop - b.colH * F;
  g.drawImage(b.out, XC - b.w * F / 2, topPad + colTop, b.w * F, b.h * F);
  const headTop = MONKEY_BOTTOM - (798 - 188) * F - headUp;
  g.drawImage(h.out, XC - h.w * F / 2, topPad + headTop, h.w * F, h.h * F);
  g.drawImage(m.out, 0, topPad);
  return c;
}

const photo18 = await load(P18);
const M = await monkey(), B = await base(photo18), H = await head(photo18);
const results = {monkey: M.out.toDataURL('image/png'), base: B.out.toDataURL('image/png'), head: H.out.toDataURL('image/png'),
  assembled: preview(M, B, H).toDataURL('image/png'), exploded: preview(M, B, H, 0, 330, 380).toDataURL('image/png')};
window.results = results;
// numbers for products.js (fractions of the frame; the demo's tool = column + base, centred)
const frac = v => +(v / FRAME).toFixed(4);
window.info = {F: +F.toFixed(4), monkeyBox: M.box,
  tool: {width: frac(B.w * F), top: frac(MONKEY_BOTTOM - 6 * F - B.colH * F), ratio: +(B.w / B.h).toFixed(4), baseStartsAt: +(B.colH / B.h).toFixed(3), ringsEndAt: +((B.colH + 93) / B.h).toFixed(3)},
  head: {width: frac(H.w * F), top: frac(MONKEY_BOTTOM - (798 - 188) * F), ratio: +(H.w / H.h).toFixed(4)},
  art: {h: +(MONKEY_H / FRAME).toFixed(4), bottom: +((FRAME - MONKEY_BOTTOM) / FRAME).toFixed(4)}};
window.png = results.assembled;
window.done = true;
</script>
