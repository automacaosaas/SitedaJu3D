// The Macacoscópio as the 3D preview of the site (dist/assets/models/macacoscopio.glb), PROVISIONAL: the model of monkey.js (made from the
// photos for the showcase) until the print file is published. Fixed colours: the painted face and belly are baked into vertex colours
// (COLOR_0) and nothing is selectable. Two materials: "fixed" (the printed plastic) and "gloss" (eyes and nose). Read by export-glb.cjs.
import * as THREE from 'three';

    } else target.col.push(base.r, base.g, base.b);

});
